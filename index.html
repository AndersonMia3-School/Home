<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1e1e2e">
  <meta name="description" content="My home page for my chromebook">
  <title>Home</title>
  <style>
    :root {
      color-scheme: dark;
      --wallpaper: #11111b;
      --surface: rgba(30, 30, 46, .92);
      --surface-raised: #313244;
      --surface-hover: #45475a;
      --text: #cdd6f4;
      --muted: #a6adc8;
      --blue: #89b4fa;
      --cyan: #89dceb;
      --green: #a6e3a1;
      --border: rgba(205, 214, 244, .12);
      --shadow: 0 18px 55px rgba(0, 0, 0, .35);
    }

    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 48px 24px 44px;
      color: var(--text);
      font-family: Cantarell, "Segoe UI", system-ui, sans-serif;
      background-color: var(--wallpaper);
      background-image: radial-gradient(ellipse at 50% 0%, #313244 0, #181825 47%, #11111b 100%);
    }

    .top-bar {
      position: fixed;
      z-index: 2;
      inset: 0 0 auto;
      display: flex;
      height: 32px;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background: rgba(17, 17, 27, .88);
      color: var(--text);
      font-size: .82rem;
      box-shadow: 0 1px 0 rgba(255, 255, 255, .06);
      backdrop-filter: blur(16px);
    }
    .top-bar strong { font-weight: 700; }
    .top-status { display: flex; gap: 12px; align-items: center; color: var(--muted); }
    .arch-mark { color: var(--blue); font-weight: 800; letter-spacing: .04em; }

    main { width: min(1120px, 100%); margin: 14px auto 0; }
    .intro { margin: 0 0 28px; text-align: center; }
    .eyebrow { color: var(--blue); font-size: .76rem; font-weight: 750; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 9px 0 5px; font-size: clamp(2rem, 5vw, 3rem); font-weight: 650; letter-spacing: -.045em; }
    .intro p { margin: 0; color: var(--muted); }

    .layout { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(320px, .85fr); gap: 20px; align-items: start; }
    .panel {
      padding: 21px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }
    .panel-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 17px; }
    h2 { margin: 0; font-size: 1.15rem; font-weight: 650; letter-spacing: -.02em; }
    .directory-title { color: var(--text); text-decoration: none; }
    .directory-title:hover, .directory-title:focus-visible { color: var(--blue); text-decoration: underline; text-underline-offset: 4px; }
    .open-link { color: var(--blue); font-size: .86rem; font-weight: 650; text-decoration: none; white-space: nowrap; }
    .open-link:hover { color: var(--cyan); text-decoration: underline; }

    .class-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 11px; }
    .class-tile {
      display: flex;
      min-height: 104px;
      flex-direction: column;
      justify-content: space-between;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: linear-gradient(145deg, #313244, #242436);
      color: var(--text);
      text-decoration: none;
      transition: transform .16s ease, border-color .16s ease, background .16s ease;
    }
    .class-tile:hover, .class-tile:focus-visible { transform: translateY(-3px); border-color: rgba(137, 180, 250, .55); background: var(--surface-hover); outline: none; }
    .tile-icon { display: grid; width: 30px; height: 30px; place-items: center; border-radius: 9px; background: rgba(137, 180, 250, .14); color: var(--blue); font-size: .8rem; font-weight: 800; }
    .class-tile:nth-child(3n + 2) .tile-icon { background: rgba(137, 220, 235, .13); color: var(--cyan); }
    .class-tile:nth-child(3n) .tile-icon { background: rgba(166, 227, 161, .13); color: var(--green); }
    .tile-name { margin-top: 13px; font-size: .9rem; font-weight: 650; }

    .calendar-frame { display: block; width: 100%; height: 440px; border: 0; border-radius: 10px; background: #fff; }
    .calendar-note { margin: 12px 0 0; color: var(--muted); font-size: .8rem; line-height: 1.5; }
    .calendar-note a { color: var(--blue); }
    .footer { margin-top: 22px; text-align: center; color: #6c7086; font-size: .76rem; }

    @media (max-width: 820px) {
      .layout { grid-template-columns: 1fr; }
    }
    @media (max-width: 520px) {
      body { padding: 46px 14px 32px; }
      .top-bar { padding: 0 10px; }
      .panel { padding: 16px; }
      .class-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .class-tile { min-height: 90px; }
      .calendar-frame { height: 380px; }
      .panel-heading { align-items: flex-start; }
      .top-status { gap: 7px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="top-bar" aria-label="Desktop top bar">
    <strong>Activities</strong>
    <div class="top-status"><span class="arch-mark">ARCH</span><span aria-label="Wi-Fi connected">◉</span><span aria-label="Battery status">▰</span></div>
  </div>

  <main>

    <div class="layout">
      <section class="panel" aria-labelledby="classes-heading">
        <div class="panel-heading">
          <h2 id="classes-heading"><p>Classes</p></h2>
          <a class="open-link" href="https://classroom.google.com/" target="_blank" rel="noopener noreferrer">Google Classroom ↗</a>
        </div>
        <!-- Replace each tile's label and href with the name and Classroom link for your class. -->
        <nav class="class-grid" aria-label="Class links">
          <a class="class-tile" href="https://classroom.google.com/c/ODE3MDg3NDczOTc1" target="_blank" rel="noopener noreferrer"><span class="tile-icon">01</span><span class="tile-name">MCSDTV</span></a>
          <a class="class-tile" href="https://classroom.google.com/c/ODc4MTI0MjU1MDEy" target="_blank" rel="noopener noreferrer"><span class="tile-icon">02</span><span class="tile-name">Computer Science</span></a>
          <a class="class-tile" href="https://classroom.google.com/c/ODc3MTAyNjUxMTg1" target="_blank" rel="noopener noreferrer"><span class="tile-icon">03</span><span class="tile-name">IED</span></a>
          <a class="class-tile" href="https://classroom.google.com/c/ODc4Mjg0MzQ2NTU4" target="_blank" rel="noopener noreferrer"><span class="tile-icon">04</span><span class="tile-name">Music and Media</span></a>
          <a class="class-tile" href="https://classroom.google.com/c/ODY5NjE0NzA3NjEy" target="_blank" rel="noopener noreferrer"><span class="tile-icon">05</span><span class="tile-name">Science</span></a>
          <a class="class-tile" href="https://classroom.google.com/c/ODc4MjgxMjE1NTU3" target="_blank" rel="noopener noreferrer"><span class="tile-icon">06</span><span class="tile-name">ELA</span></a>
          <a class="class-tile" href="https://classroom.google.com/c/ODc3MTA3NDAzOTk0" target="_blank" rel="noopener noreferrer"><span class="tile-icon">07</span><span class="tile-name">Algebra</span></a>
          <a class="class-tile" href="https://classroom.google.com/c/ODc4MjQxOTc3OTk5" target="_blank" rel="noopener noreferrer"><span class="tile-icon">08</span><span class="tile-name">Global</span></a>
        </nav>
      </section>

      <section class="panel" aria-labelledby="calendar-heading">
        <div class="panel-heading">
          <h2 id="calendar-heading">Google Calendar</h2>
          <a class="open-link" href="https://calendar.google.com/calendar/" target="_blank" rel="noopener noreferrer">Open Calendar ↗</a>
        </div>
        <iframe class="calendar-frame" title="Google Calendar" src="https://calendar.google.com/calendar/embed?src=mi_anderson%40mohonasen.org&ctz=America%2FNew_York" loading="lazy"></iframe>
      </section>
    </div>
  </main>
</body>
</html>
